services:
  api:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npm install && npx tsx src/app.ts"
    ports: ["3000:3000"]
    # Ensure api container restarts if it fails.
    # This is very crucial especially with PostgreSQL initial boot,
    # because database files are written to the storage directory.
    # Otherwise, after postgresql container restarts, the api container
    # may not be able to connect to the database.
    restart: unless-stopped
    depends_on:
      chromadb:
        condition: service_healthy # a healthcheck on PostgreSQL and configure api to wait until db is healthy
      # redis:
      #   condition: service_healthy
  chromadb:
    image: chromadb/chroma:1.5.3
    volumes:
      - ./chroma_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 10s
      retries: 3
